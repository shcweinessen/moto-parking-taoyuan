name: Update parking data

on:
  schedule:
    - cron: "0 19 * * 0"   # 每週一 03:00（台灣時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check data sources
        run: |
          for u in \
            "https://opendata.tycg.gov.tw/api/dataset/ffd3180e-75b0-419d-b680-2286bade7958/resource/99a8b764-8407-4c00-9e6c-57dc8452ecce/download" \
            "https://opendata.tycg.gov.tw/api/dataset/f4cc0b12-86ac-40f9-8745-885bddc18f79/resource/0daad6e6-0632-44f5-bd25-5e1de1e9146f/download"; do
            curl -sS -m 30 -o /dev/null -w "%{http_code} %{size_download} bytes %{time_total}s  $u\n" "$u" || echo "FAILED $u"
          done
      - name: Build GeoJSON
        timeout-minutes: 40
        run: python -u scripts/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update parking data $(date -u +%Y-%m-%d)"
            git push
          fi
